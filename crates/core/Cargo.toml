[package]
name = "bowerbird-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
dom_smoothie = "0.18"
# Pinned with ort =2.0.0-rc.13, which bowerbird-speech's Kokoro shares; two
# ort versions can't link into one binary.
fastembed = { version = "=7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
futures = "0.3"
genai = "=0.7.0"
oar-ocr = { version = "0.10", default-features = false, features = ["simd"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }
quick-xml = { version = "0.42", features = ["escape-html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
text-splitter = { version = "0.33", features = ["markdown"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "fs", "time", "io-util"] }
toml = "0"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

