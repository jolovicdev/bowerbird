# The workspace is MIT licensed, so dependencies must be permissive or
# file-level copyleft (MPL-2.0). GPL and LGPL code can't be linked in.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # Unmaintained, not vulnerable; reached only through Tauri's GTK bindings.
    { id = "RUSTSEC-2024-0370", reason = "build-time macro of gtk-rs 0.18, which Tauri pins" },
    { id = "RUSTSEC-2024-0436", reason = "build-time macro reached through image's OpenEXR decoder" },
    { id = "RUSTSEC-2026-0192", reason = "font parsing in imageproc, which OCR never calls" },
]
