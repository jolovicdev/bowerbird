[package]
name = "bowerbird"
version = "0.1.2"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[dependencies]
bowerbird-core = { version = "0.1.0", path = "../core" }
clap = { version = "4.6", features = ["derive"] }
genai = "=0.7.2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
