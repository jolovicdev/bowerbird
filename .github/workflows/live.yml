# Daily check of the services Bowerbird talks to: the default model, YouTube's
# caption clients, web page extraction, DuckDuckGo, and the downloads of the
# search and OCR models, plus the end-to-end tests, which ask the model real
# questions. Needs the DEEPSEEK_API_KEY secret.
name: Live

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BOWERBIRD_PDFIUM_DIR: ${{ github.workspace }}/vendor/pdfium/lib
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

jobs:
  services:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Rust version and components come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/fetch-pdfium.sh
      - run: cargo test -p bowerbird-core --test live --locked
        env:
          BOWERBIRD_LIVE: "1"
      - name: Model downloads, OCR and search by meaning
        run: cargo test -p bowerbird-core --lib --locked -- "ocr::" "embed::" "retrieve::"
        env:
          BOWERBIRD_LIVE: "1"

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci && npm --prefix ui run build
      - run: scripts/fetch-pdfium.sh
      - run: cargo build -p bowerbird-server --locked
      - run: ui/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix ui run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ui/playwright-report
