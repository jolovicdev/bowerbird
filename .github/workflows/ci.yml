name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BOWERBIRD_PDFIUM_DIR: ${{ github.workspace }}/vendor/pdfium/lib

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev cmake clang
      # The Rust version and components come from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The desktop crate embeds ui/build when it compiles.
      - run: npm --prefix ui ci && npm --prefix ui run build
      - run: scripts/fetch-pdfium.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The browser tests that need no API key: the app answers from a
      # stand-in model server. The first source they add would start the
      # 200 MB download of the search model, so it is fetched once and kept.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: search-model
        with:
          path: ~/.local/share/bowerbird/models/embeddinggemma
          key: embeddinggemma-${{ hashFiles('crates/core/src/embed.rs') }}
      - name: Search model
        if: steps.search-model.outputs.cache-hit != 'true'
        run: cargo test -p bowerbird-core --lib --locked -- the_search_model_downloads
        env:
          BOWERBIRD_LIVE: "1"
      - run: cargo build -p bowerbird-server --locked
      - run: ui/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix ui run test:flows
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flows-test-results
          path: ui/test-results

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run check

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace
          command: check licenses bans sources

  advisories:
    runs-on: ubuntu-24.04
    # A new advisory against a dependency shouldn't block unrelated changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace
          command: check advisories
