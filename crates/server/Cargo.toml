[package]
name = "bowerbird-server"
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bowerbird-core = { version = "0.1.0", path = "../core" }
bowerbird-speech = { version = "0.1.0", path = "../speech" }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
genai = "=0.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "io-util"] }
tower-http = { version = "0.7", features = ["fs"] }
