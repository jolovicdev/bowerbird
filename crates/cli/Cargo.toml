[package]
name = "bowerbird"
version = "0.2.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[dependencies]
bowerbird-core = { version = "0.2.0", path = "../core" }
clap = { version = "4.6", features = ["derive"] }
genai = "=0.7.5"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
